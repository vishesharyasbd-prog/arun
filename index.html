<style>
*{
 margin:0;
 padding:0;
 box-sizing:border-box;
}

body{
 min-height:100vh;
 display:flex;
 justify-content:center;
 align-items:center;
 padding:16px;
 font-family:Arial,sans-serif;
 color:#fff;
 background:
 radial-gradient(ellipse at 50% 5%,#164e91 0%,transparent 55%),
 linear-gradient(145deg,#06152c,#092b52 55%,#041226);
}

.container{
 width:100%;
 max-width:390px;
 text-align:center;
}

.glass{
 padding:35px 22px 29px;
 border:1px solid rgba(160,210,255,.24);
 border-radius:25px;
 background:rgba(255,255,255,.075);
 backdrop-filter:blur(18px);
 -webkit-backdrop-filter:blur(18px);
 box-shadow:0 18px 55px rgba(0,0,0,.3),
 inset 0 1px 1px rgba(255,255,255,.12);
}

.logo{
 width:76px;
 height:76px;
 margin:0 auto 17px;
 display:flex;
 align-items:center;
 justify-content:center;
 border-radius:22px;
 font-size:34px;
 font-weight:900;
 color:#fff;
 background:linear-gradient(145deg,#54b9ff,#1762d3);
 box-shadow:0 8px 28px rgba(30,130,255,.35);
}

h1{
 font-size:29px;
 letter-spacing:1px;
 font-weight:800;
 margin-bottom:9px;
}

.subtitle{
 font-size:13px;
 color:#b8d8f8;
 margin-bottom:22px;
 letter-spacing:.5px;
}

.line{
 width:55px;
 height:3px;
 background:#58b9ff;
 border-radius:10px;
 margin:0 auto 22px;
}

.info{
 padding:13px 10px;
 border-radius:13px;
 background:rgba(255,255,255,.055);
 border:1px solid rgba(255,255,255,.09);
 font-size:13px;
 color:#d6eaff;
 margin-bottom:20px;
}

.join-btn{
 display:block;
 width:100%;
 padding:16px 12px;
 border-radius:14px;
 text-decoration:none;
 color:#fff;
 font-size:16px;
 font-weight:800;
 letter-spacing:.5px;
 background:linear-gradient(100deg,#1476ed,#36b5ff);
 box-shadow:0 7px 24px rgba(26,137,255,.3);
 transition:transform .15s ease;
}

.join-btn:active{
 transform:scale(.97);
}

.footer{
 font-size:11px;
 color:#86a9cb;
 margin-top:21px;
}

</style>
</head>

<body>

<main class="container">
 <section class="glass">

  <div class="logo">AC</div>

  <h1>ARUN CRICKET</h1>

  <p class="subtitle">YOUR CRICKET COMMUNITY</p>

  <div class="line"></div>

  <div class="info">
   Welcome to the official Arun Cricket Telegram channel.
  </div>

  <a class="join-btn"
     id="joinButton"
     href="https://t.me/+dvRprq2lDaUwNjk9">
     JOIN TELEGRAM CHANNEL →
  </a>

  <p class="footer">
   Official Telegram Community
  </p>

 </section>
</main>

<script>
document.getElementById('joinButton').addEventListener('click',function(e){

  e.preventDefault();

  const url = this.href;

  if(typeof fbq === 'function'){
    fbq('track','Subscribe');
  }

  setTimeout(function(){
    window.location.href = url;
  },350);

});
</script>

</body>
</html>
